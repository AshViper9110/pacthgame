<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>パッチゲーム</title>
<style>
  /* 配色とレイアウトの基本設定（ダークテーマ） */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: sans-serif; background: #0d0d12; color: #eee; max-width: 760px; margin: 24px auto; padding: 0 16px; }
  h2 { margin: 0 0 8px; letter-spacing: 2px; }
  .hud { display: flex; flex-wrap: wrap; gap: 16px; font-size: 14px; color: #aaa; }
  .hud b { color: #fff; font-size: 18px; }
  .progress { height: 8px; background: #222; border-radius: 4px; margin: 10px 0 14px; overflow: hidden; }
  #bar { height: 100%; width: 0; background: linear-gradient(90deg, #3a7bd5, #6f6); transition: width .4s; }
  .card { background: #181820; border-left: 4px solid #3a7bd5; padding: 10px 14px; border-radius: 4px; margin: 0 0 12px; }
  #culprits { font-family: monospace; font-size: 14px; margin: 0 0 12px; }
  #culprits label { display: inline-block; margin: 2px 14px 2px 0; cursor: pointer; }
  .editor-wrap { border: 1px solid #333; border-radius: 6px; overflow: hidden; background: #1e1e1e; }
  .tab-bar { background: #252526; color: #ccc; font-family: monospace; font-size: 13px; padding: 6px 12px; border-bottom: 1px solid #333; }
  .editor-body { display: flex; height: calc(100vh - 300px); min-height: 240px; }
  #gutter { width: 40px; overflow: hidden; background: #1e1e1e; color: #666; font-family: monospace; font-size: 14px; line-height: 21px; text-align: right; padding: 8px 8px 8px 0; white-space: pre; user-select: none; }
  #editor { flex: 1; height: 100%; border: none; outline: none; resize: none; background: #1e1e1e; color: #d4d4d4; font-family: monospace; font-size: 14px; line-height: 21px; padding: 8px; white-space: pre; overflow: auto; tab-size: 2; }
  .buttons { margin-top: 10px; }
  button { padding: 9px 18px; margin-right: 8px; cursor: pointer; border: 1px solid #444; background: #222; color: #eee; border-radius: 4px; font-size: 14px; }
  button.primary { background: #3a7bd5; border-color: #3a7bd5; font-weight: bold; }
  #result { margin-top: 12px; white-space: pre-wrap; min-height: 3em; font-size: 15px; }
  .ok { color: #6f6; }
  .ng { color: #f66; }
  .shake { animation: shake .4s; }
  .flash-ok { animation: flashOk .6s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  @keyframes flashOk { 0% { box-shadow: 0 0 0 0 rgba(102,255,102,.8); } 100% { box-shadow: 0 0 0 16px rgba(102,255,102,0); } }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #overlay[hidden] { display: none; }
  .panel { background: #1c1c26; border: 2px solid #3a7bd5; border-radius: 8px; padding: 28px 32px; text-align: center; min-width: 260px; animation: pop .3s; }
  #ov-title { margin: 0 0 8px; font-size: 28px; letter-spacing: 2px; }
  #ov-text { color: #bbb; margin: 0 0 18px; }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  details { margin-top: 16px; }
  .memo { font-family: monospace; font-size: 14px; white-space: pre-wrap; margin-top: 8px; background: #1e1e1e; padding: 8px; }
  body { background: #030503 !important; color: #7dff7d; font-family: monospace; }
  .scan { position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 1px, transparent 1px 3px); z-index: 50; }
  .alert { background: #2a0000; color: #ff3b3b; border: 1px solid #ff3b3b; padding: 6px 10px; font-weight: bold; letter-spacing: 1px; animation: blink 1.2s steps(2, start) infinite; margin-bottom: 10px; }
  @keyframes blink { to { opacity: .45; } }
  .glitch { position: relative; color: #fff; font-size: 26px; letter-spacing: 4px; }
  .glitch::before, .glitch::after { content: attr(data-text); position: absolute; left: 0; top: 0; width: 100%; overflow: hidden; }
  .glitch::before { color: #ff2a2a; transform: translate(-2px, 0); clip-path: inset(10% 0 60% 0); animation: g1 2.4s infinite linear alternate-reverse; }
  .glitch::after { color: #2affff; transform: translate(2px, 0); clip-path: inset(60% 0 10% 0); animation: g2 3s infinite linear alternate-reverse; }
  @keyframes g1 { 0% { clip-path: inset(10% 0 60% 0); } 50% { clip-path: inset(40% 0 30% 0); } 100% { clip-path: inset(20% 0 50% 0); } }
  @keyframes g2 { 0% { clip-path: inset(70% 0 5% 0); } 50% { clip-path: inset(20% 0 65% 0); } 100% { clip-path: inset(50% 0 20% 0); } }
  .hud span { color: #5c5; }
  .hud b { color: #ff4d4d; text-shadow: 0 0 6px #f00; }
  .progress { background: #0a1a0a; border: 1px solid #1f4d1f; }
  #bar { background: repeating-linear-gradient(90deg, #39ff14 0 8px, #1a8a0a 8px 10px); }
  .card { background: #0a0a0a; border-left: 4px solid #ff2a2a; color: #ffb3b3; }
  #culprits { color: #7dff7d; }
  .editor-wrap { border: 1px solid #1f6f1f; box-shadow: 0 0 14px rgba(57,255,20,.15), inset 0 0 40px rgba(0,0,0,.6); }
  .tab-bar { background: #0a1a0a; color: #39ff14; border-bottom: 1px solid #1f6f1f; }
  #editor { background: #050a05 !important; color: #8fff8f !important; caret-color: #39ff14; }
  #gutter { background: #050a05 !important; color: #2f6f2f !important; }
  button { background: #031003; border: 1px solid #39ff14; color: #39ff14; text-transform: uppercase; letter-spacing: 1px; font-family: monospace; }
  button:hover { background: #39ff14; color: #000; }
  button.primary { background: #2a0000; border-color: #ff2a2a; color: #ff5555; }
  button.primary:hover { background: #ff2a2a; color: #000; }
  .ok { color: #39ff14; text-shadow: 0 0 6px #39ff14; }
  .ng { color: #ff3b3b; text-shadow: 0 0 6px #f00; animation: flicker .3s steps(2) 2; }
  @keyframes flicker { 50% { opacity: .3; } }
  .shake { animation: shake .3s steps(6) 2; }
  #overlay { background: rgba(20,0,0,.85); }
  .panel { background: #050000; border: 2px solid #ff2a2a; box-shadow: 0 0 30px rgba(255,0,0,.4); color: #ffb3b3; border-radius: 0; animation: pop .3s; }
  .memo { background: #050a05; color: #7dff7d; border: 1px solid #1f4d1f; }
  details summary { color: #39ff14; cursor: pointer; }
  html, body { height: 100%; }
  body { margin: 0; padding: 0; max-width: none; height: 100vh; display: flex; flex-direction: row; overflow: hidden; }
  #top { flex: 1 1 50%; overflow: auto; padding: 12px 16px; border-right: 2px solid #1f6f1f; min-width: 0; min-height: 0; }
  #bottom { flex: 1 1 50%; overflow: auto; padding: 12px 16px; min-width: 0; min-height: 0; }
  /* 画面が狭いとき（スマホなど）は上下に並べる */
  @media (max-width: 800px) {
    body { flex-direction: column; }
    #top { border-right: none; border-bottom: 2px solid #1f6f1f; }
  }
  #top .progress { margin: 8px 0 10px; }
  #servers { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 10px; }
  .srv { border: 1px solid #1f4d1f; padding: 10px; font-size: 12px; background: #050a05; color: #4a4; }
  .srv.safe { border-color: #39ff14; color: #39ff14; }
  .srv.hit { border-color: #ff2a2a; color: #ff4d4d; animation: blink .8s steps(2, start) infinite; }
  #log { height: 110px; overflow: auto; font-size: 12px; background: #000; color: #6c6; border: 1px solid #1f4d1f; padding: 6px; margin-bottom: 10px; }
  #netmap { width: 100%; height: auto; aspect-ratio: 420 / 260; margin-bottom: 8px; background: #030803; border: 1px solid #1f4d1f; }
  .flow { stroke-dasharray: 6 6; animation: dash .6s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -12; } }
  .timebar { height: 6px; margin: 0 0 10px; }
  #tbar { height: 100%; width: 0; background: #ff8c1a; transition: width .3s; }
  #tbar.low { background: #ff2a2a; animation: blink .6s steps(2, start) infinite; }
  #soundBtn, #hintBtn { font-size: 12px; padding: 5px 10px; }
</style>
</head>
<body>
<!-- 上半分: 攻撃の状況（接続図・サーバー状態・ログ）を表示 -->
<div id="top">
<div class="alert">⚠ INTRUSION DETECTED ⚠ 脆弱な関数を特定して修復せよ</div>
<h2 class="glitch" data-text="パッチゲーム">パッチゲーム</h2>
<div class="hud">
  <span>ステージ <b id="stage"></b></span>
  <span>ライフ <b id="lives"></b></span>
  <span>スコア <b id="score"></b></span>
  <span>コンボ <b id="combo"></b></span>
  <span>侵入度 <b id="time"></b></span>
  <button id="soundBtn">音: ON</button>
</div>
<div class="progress"><div id="bar"></div></div>
<div class="progress timebar"><div id="tbar"></div></div>

<svg id="netmap" viewBox="0 0 420 260" preserveAspectRatio="xMidYMid meet"></svg>
<div id="servers"></div>
<div id="log"></div>
<p id="desc" class="card"></p>

</div>
<!-- 下半分: 原因の選択、コードエディタ、テスト結果を操作する -->
<div id="bottom">
<div id="culprits"></div>

<div id="editorWrap" class="editor-wrap">
  <div class="tab-bar">patch.js</div>
  <div class="editor-body">
    <div id="gutter"></div>
    <textarea id="editor" spellcheck="false" wrap="off"></textarea>
  </div>
</div>

<div class="buttons">
  <button id="stageBtn">検証環境にデプロイ</button>
  <button id="check" class="primary" disabled>本番に反映</button>
  <button id="hintBtn">ヒント（-10点）</button>
</div>
<div id="result"></div>

<details>
  <summary>書き方メモ</summary>
  <div class="memo">if (条件) {
  // 条件が真のときだけ実行
} else {
  // 条件が偽のときに実行
}

例:
if (name === "") {
  return false;
} else {
  return true;
}

while (条件) {
  // 条件が真の間、繰り返し実行
}

例:
let i = 0;
while (i < 3) {
  i = i + 1; // 変数を変えないと無限ループになる
}</div>
</details>

</div>
<div id="overlay" hidden>
  <div class="panel">
    <h3 id="ov-title"></h3>
    <p id="ov-text"></p>
    <button id="ov-btn" class="primary"></button>
  </div>
</div>

<script>
// 各問題: code の中のどれかの関数が原因。culprit がその関数名。
// プレイヤーは原因の関数を選び、直してから tests で判定される。
const problems = [
  {
    desc: "名前の検証。前後の空白を除いたうえで、1文字以上20文字以下なら許可してください。原因の関数を見つけてから直します。",
    fn: "validateName",
    culprit: "checkLength",
    code: `// 前後の空白を取り除いて名前を整える
function trimName(name) {
  return name.trim();
}

// 名前の文字数を確認する
function checkLength(name) {
  return name.length > 0;
}

// 整えた名前を使って、長さを確認する
function validateName(name) {
  const n = trimName(name);
  return checkLength(n);
}`,
    tests: [
      [["alice"], true],
      [[""], false],
      [["a".repeat(21)], false],
      [["   "], false],
    ],
  },
  {
    desc: "ファイル名の検証。\"..\" と \"/\" を含む名前は拒否してください。原因の関数を見つけてから直します。",
    fn: "isSafeFileName",
    culprit: "hasSlash",
    code: `// 入力の前後の空白を整える
function normalize(p) {
  return p.trim();
}

// 「..」を含むかどうかを調べる
function hasParent(p) {
  return p.indexOf('..') !== -1;
}

// 「/」を含むかどうかを調べる
function hasSlash(p) {
  return p.indexOf('/') === 0;
}

// 両方の条件を満たす名前だけを安全とみなす
function isSafeFileName(name) {
  const p = normalize(name);
  return !hasParent(p) && !hasSlash(p);
}`,
    tests: [
      [["report.txt"], true],
      [["../secret"], false],
      [["a/b.txt"], false],
    ],
  },
  {
    desc: "残高チェック。引き出し額は1以上で、残高以下のときだけ許可してください。原因の関数を見つけてから直します。",
    fn: "canWithdraw",
    culprit: "hasEnough",
    code: `// 金額が1以上かを調べる
function isPositive(x) {
  return x > 0;
}

// 残高で足りるかを調べる
function hasEnough(balance, amount) {
  return amount < balance;
}

// 金額が正で、残高で足りるときに引き出し可
// 両方の確認はそれぞれの関数に任せる
function canWithdraw(balance, amount) {
  return isPositive(amount) && hasEnough(balance, amount);
}`,
    tests: [
      [[100, 50], true],
      [[100, 200], false],
      [[100, 0], false],
      [[100, 100], true],
    ],
  },
  {
    desc: "ログイン試行の制限。直近の失敗回数が5回未満なら試行を許可してください。原因の関数を見つけてから直します。",
    fn: "canTryLogin",
    culprit: "countRecentFailures",
    code: `// 直近のログから失敗の回数を数える
function countRecentFailures(log) {
  return log.filter(e => e.ok === true).length;
}

// 失敗回数が上限未満なら試行を許可する
function canTryLogin(log) {
  return countRecentFailures(log) < 5;
}`,
    tests: [
      [[[]], true],
      [[Array(4).fill({ ok: false })], true],
      [[Array(5).fill({ ok: false })], false],
    ],
  },
  {
    desc: "メールアドレスの簡易チェック。@を含み、空白を含まないものだけ許可してください。原因の関数を見つけてから直します。",
    fn: "isValidEmail",
    culprit: "hasSpace",
    code: `// @を含むかどうかを調べる
function hasAt(email) {
  return email.includes('@');
}

// 空白を含むかどうかを調べる
function hasSpace(email) {
  return email.startsWith(' ');
}

// @があり、空白がないものを有効とする
function isValidEmail(email) {
  return hasAt(email) && !hasSpace(email);
}`,
    tests: [
      [["a@b.com"], true],
      [["abc"], false],
      [["a b@c.com"], false],
    ],
  },
  {
    desc: "パスワードの強度チェック。8文字以上で、英字と数字をどちらも含むものだけ許可してください。",
    fn: "isStrongPassword",
    culprit: "longEnough",
    code: `// 8文字以上あるかを調べる
function longEnough(pw) {
  return pw.length > 8;
}

// 英字を含むかを調べる
function hasLetter(pw) {
  return /[a-zA-Z]/.test(pw);
}

// 数字を含むかを調べる
function hasDigit(pw) {
  return /[0-9]/.test(pw);
}

// 3つの条件をすべて満たすときだけ強いと判定する
function isStrongPassword(pw) {
  return longEnough(pw) && hasLetter(pw) && hasDigit(pw);
}`,
    tests: [
      [["abcd1234"], true],
      [["abc1"], false],
      [["12345678"], false],
      [["abcdefgh"], false],
    ],
  },
  {
    desc: "ログイン後の移動先チェック。サイト内のパス（/ から始まるもの）だけ許可し、別のサイトへ飛ばせる形は拒否してください。",
    fn: "isSafeRedirect",
    culprit: "isProtocolRelative",
    code: `// 先頭が「/」かどうかを調べる
function startsWithSlash(url) {
  return url.startsWith('/');
}

// 先頭が「//」（別のサイトを指せる形）かどうかを調べる
function isProtocolRelative(url) {
  return url.startsWith('///');
}

// サイト内の移動だけを許可する
function isSafeRedirect(url) {
  return startsWithSlash(url) && !isProtocolRelative(url);
}`,
    tests: [
      [["/home"], true],
      [["//evil.example"], false],
      [["https://evil.example"], false],
    ],
  },
  {
    desc: "投稿の削除権限。管理者か、その投稿の持ち主だけが削除できるようにしてください。",
    fn: "canDelete",
    culprit: "isOwner",
    code: `// 管理者かどうかを調べる
function isAdmin(user) {
  return user.role === 'admin';
}

// 投稿の持ち主かどうかを調べる
function isOwner(user, post) {
  return post.ownerId !== undefined;
}

// 管理者か持ち主だけが削除できる
function canDelete(user, post) {
  return isAdmin(user) || isOwner(user, post);
}`,
    tests: [
      [[{ id: 1, role: "user" }, { ownerId: 1 }], true],
      [[{ id: 2, role: "user" }, { ownerId: 1 }], false],
      [[{ id: 3, role: "admin" }, { ownerId: 1 }], true],
    ],
  },
  {
    desc: "アクセス回数の制限。直近1秒間のリクエストが5回未満のときだけ許可してください。",
    fn: "canRequest",
    culprit: "countRecent",
    code: `// 直近の時間内にあったリクエストの数を数える
function countRecent(times, now, windowMs) {
  return times.filter(t => now - t > windowMs).length;
}

// 直近1秒間のリクエストが5回未満なら許可する
function canRequest(times, now) {
  return countRecent(times, now, 1000) < 5;
}`,
    tests: [
      [[[], 10000], true],
      [[[9900, 9910, 9920, 9930, 9940], 10000], false],
      [[[1, 2, 3, 4, 5, 6, 7], 10000], true],
    ],
  },
  {
    desc: "画面に出す文字の無害化。「&」「<」「>」を、そのまま表示される安全な表記に置き換えてください。",
    fn: "escapeHtml",
    culprit: "escapeTags",
    code: `// 「&」を「&amp;」に置き換える
function escapeAmp(s) {
  return s.replace(/&/g, '&amp;');
}

// 「<」と「>」を無害な表記に置き換える
function escapeTags(s) {
  return s.replace(/</g, '&lt;');
}

// 画面に出す前に特殊な文字を無害な形にする
function escapeHtml(s) {
  return escapeTags(escapeAmp(s));
}`,
    tests: [
      [["hello"], "hello"],
      [["<b>"], "&lt;b&gt;"],
      [["a&b"], "a&amp;b"],
    ],
  },
];

// ゲーム全体の状態
// index: 現在の問題番号、score: 合計点、lives: 残りライフ、combo: 連続正解数
// 検証環境での合格状態。本番への反映はこの状態が必要
let stagedOK = false;
let stagedCode = null;
const stageBtn = document.getElementById("stageBtn");
const prodBtn = document.getElementById("check");

const MAX_LIVES = 3;
let index = 0;
let score = 0;
let lives = MAX_LIVES;
let combo = 0;

// 検証に失敗できる回数。上限に達すると侵入される
const MAX_FAILS = 3;
let stageFails = 0;          // このステージで検証に失敗した回数（= 侵入度）
let hintUsed = false;        // このステージでヒントを使ったか
let locked = false;          // クリアや侵入の演出中は操作を止める
let soundOn = true;
const hintBtn = document.getElementById("hintBtn");
const soundBtn = document.getElementById("soundBtn");

const descEl = document.getElementById("desc");
const culpritEl = document.getElementById("culprits");
const editor = document.getElementById("editor");
const editorWrap = document.getElementById("editorWrap");
const resultEl = document.getElementById("result");
const checkBtn = document.getElementById("check");
const gutter = document.getElementById("gutter");
const overlay = document.getElementById("overlay");
const ovTitle = document.getElementById("ov-title");
const ovText = document.getElementById("ov-text");
const ovBtn = document.getElementById("ov-btn");

// 入力の行数が変わったら、行番号を更新する
editor.addEventListener("input", updateGutter);
editor.addEventListener("scroll", () => { gutter.scrollTop = editor.scrollTop; });
editor.addEventListener("keydown", (e) => {
  const s = editor.selectionStart;
  const t = editor.selectionEnd;
  if (e.key === "Tab") {
    e.preventDefault();
    editor.value = editor.value.slice(0, s) + "  " + editor.value.slice(t);
    editor.selectionStart = editor.selectionEnd = s + 2;
    updateGutter();
  } else if (e.key === "Enter") {
    e.preventDefault();
    const before = editor.value.slice(0, s);
    const line = before.slice(before.lastIndexOf("\n") + 1);
    const indent = line.match(/^\s*/)[0];
    const extra = /[{(\[]\s*$/.test(line) ? "  " : "";
    const ins = "\n" + indent + extra;
    editor.value = before + ins + editor.value.slice(t);
    editor.selectionStart = editor.selectionEnd = s + ins.length;
    updateGutter();
  }
});

// 行番号の欄を、エディタの行数に合わせて作り直す
function updateGutter() {
  const n = editor.value.split("\n").length;
  let s = "";
  for (let i = 1; i <= n; i++) s += i + "\n";
  gutter.textContent = s;
}

// サーバー名（SRV-01 のように2桁にそろえる）
function srvName(i) {
  return "SRV-" + String(i + 1).padStart(2, "0");
}

function pushLog(msg) {
  const l = document.getElementById("log");
  const line = document.createElement("div");
  line.textContent = new Date().toLocaleTimeString() + " " + msg;
  l.appendChild(line);
  l.scrollTop = l.scrollHeight;
}

function renderServers() {
  const el = document.getElementById("servers");
  el.innerHTML = "";
  problems.forEach((p, i) => {
    const state = i < index ? "safe" : i === index ? "hit" : "idle";
    const d = document.createElement("div");
    d.className = "srv " + state;
    const label = state === "safe" ? "OK" : state === "hit" ? "COMPROMISED" : "STANDBY";
    d.textContent = srvName(i) + " " + label;
    el.appendChild(d);
  });
}

// 攻撃の流れを時間差でログに流す
function playAttackFlow(i) {
  const steps = [
    "[SCAN] " + srvName(i) + " への外部アクセスを検出",
    "[WARN] 想定外の入力パターンを観測",
    "[ALERT] 関数の戻り値が仕様と一致しない",
    "[INFO] 脆弱なコードを確認し、パッチを準備してください",
  ];
  // 別のステージに移った後は、古いログを流さない
  steps.forEach((msg, n) => setTimeout(() => { if (index === i) pushLog(msg); }, 300 + n * 500));
}

// 上半分にネットワークの接続図を描く
function renderNetwork() {
  const svg = document.getElementById("netmap");
  const NS = "http://www.w3.org/2000/svg";
  svg.innerHTML = "";
  const mk = (tag, attrs, text) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text) e.textContent = text;
    svg.appendChild(e);
    return e;
  };
  // 攻撃元 → ファイアウォール
  mk("line", { x1: 70, y1: 130, x2: 130, y2: 130, stroke: "#ff2a2a", "stroke-width": 2, class: "flow" });
  mk("rect", { x: 10, y: 110, width: 60, height: 40, rx: 4, fill: "#2a0000", stroke: "#ff2a2a" });
  mk("text", { x: 40, y: 134, fill: "#ff6b6b", "font-size": 9, "text-anchor": "middle" }, "ATTACKER");
  mk("rect", { x: 130, y: 105, width: 70, height: 50, rx: 4, fill: "#0a1a0a", stroke: "#39ff14" });
  mk("text", { x: 165, y: 134, fill: "#39ff14", "font-size": 10, "text-anchor": "middle" }, "FIREWALL");
  // ファイアウォール → 各サーバー
  problems.forEach((p, i) => {
    const n = problems.length;
    const step = n > 1 ? 220 / (n - 1) : 0;
    const y = 20 + i * step;
    const bh = Math.min(22, Math.max(12, step - 4));
    const fs = 11;
    const state = i < index ? "safe" : i === index ? "hit" : "idle";
    const color = state === "safe" ? "#39ff14" : state === "hit" ? "#ff2a2a" : "#1f4d1f";
    const attrs = { x1: 200, y1: 130, x2: 290, y2: y, stroke: color, "stroke-width": 2 };
    if (state === "hit") attrs.class = "flow";
    mk("line", attrs);
    mk("rect", { x: 290, y: y - bh / 2, width: 115, height: bh, rx: 3, fill: "#050a05", stroke: color });
    mk("text", { x: 347, y: y + fs / 3, fill: color, "font-size": fs, "text-anchor": "middle" }, srvName(i));
  });
}

// 画面の上部（ステージ・ライフ・スコア・コンボ・進行バー）を現在の状態に合わせて更新する
// 接続図とサーバー状態も同時に描き直す
function updateHud() {
  renderNetwork();
  renderServers();
  document.getElementById("stage").textContent = `${index + 1}/${problems.length}`;
  document.getElementById("lives").textContent = "♥".repeat(lives) + "♡".repeat(MAX_LIVES - lives);
  document.getElementById("score").textContent = score;
  document.getElementById("combo").textContent = combo > 1 ? `×${combo}` : "-";
  document.getElementById("bar").style.width = (index / problems.length * 100) + "%";
  updateIntrusion();
}

// コード中の関数名を候補として並べ、原因を選ばせる
function buildCulpritChoices(code) {
  culpritEl.innerHTML = "";
  const title = document.createElement("div");
  title.textContent = "原因の関数を選ぶ:";
  culpritEl.appendChild(title);
  const names = [...code.matchAll(/function\s+(\w+)/g)].map(m => m[1]);
  names.forEach(name => {
    const label = document.createElement("label");
    const input = document.createElement("input");
    input.type = "radio";
    input.name = "culprit";
    input.value = name;
    label.appendChild(input);
    label.appendChild(document.createTextNode(" " + name));
    culpritEl.appendChild(label);
  });
}

// 現在の問題を画面に読み込み、エディタと原因の選択肢を初期化する
function load() {
  const p = problems[index];
  descEl.textContent = p.desc.replace("原因の関数を見つけてから直します。", "");
  playAttackFlow(index);
  editor.value = p.code;
  // 問題が変わったら検証の結果と、侵入度・ヒントをリセットする
  stageFails = 0;
  hintUsed = false;
  locked = false;
  hintBtn.disabled = false;
  stagedOK = false;
  stagedCode = null;
  prodBtn.disabled = true;
  updateGutter();

  resultEl.textContent = "";
  resultEl.className = "";
  updateHud();
}

// 効果音（WebAudio）。使えない環境では何もしない
let audioCtx = null;
function beep(freq, dur, type, delay) {
  if (!soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime + (delay || 0);
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type || "square";
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.06, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur);
  } catch (e) { /* 音が出せなくてもゲームは続ける */ }
}
const sfx = {
  pass()  { beep(660, 0.1); beep(880, 0.12, "square", 0.1); },
  fail()  { beep(160, 0.25, "sawtooth"); },
  clear() { beep(523, 0.1); beep(659, 0.1, "square", 0.1); beep(784, 0.18, "square", 0.2); },
  over()  { beep(220, 0.3, "sawtooth"); beep(150, 0.5, "sawtooth", 0.3); },
};

// 侵入度の表示とバーを更新する（上限の1つ手前から赤く点滅）
function updateIntrusion() {
  document.getElementById("time").textContent =
    "■".repeat(stageFails) + "□".repeat(MAX_FAILS - stageFails);
  const bar = document.getElementById("tbar");
  bar.style.width = (stageFails / MAX_FAILS * 100) + "%";
  bar.classList.toggle("low", stageFails >= MAX_FAILS - 1);
}

// 侵入を許した: ライフが1つ減り、同じ問題をやり直す
function onBreach() {
  locked = true;
  combo = 0;
  lives--;
  updateHud();
  pushLog("[ALERT] " + srvName(index) + " が突破された");
  resultEl.className = "ng";
  resultEl.textContent = srvName(index) + " に侵入されました（検証の失敗が " + MAX_FAILS + " 回）";
  retriggerClass("shake");
  if (lives <= 0) {
    sfx.over();
    showOverlay("GAME OVER", `スコア: ${score}`, "最初からやり直す", restart, "#f66");
  } else {
    sfx.fail();
    showOverlay("侵入された…", `ライフ -1（残り ${lives}）`, "もう一度挑戦", () => { load(); }, "#f66");
  }
}

// 最終スコアからランクを決める
function rankOf(s) {
  return s >= 450 ? "S" : s >= 350 ? "A" : s >= 250 ? "B" : "C";
}

function showOverlay(title, text, btnLabel, onClick, color) {
  ovTitle.textContent = title;
  ovTitle.style.color = color || "#fff";
  ovText.textContent = text;
  ovBtn.textContent = btnLabel;
  ovBtn.onclick = () => { overlay.hidden = true; onClick(); };
  overlay.hidden = false;
}

function restart() {
  index = 0;
  score = 0;
  lives = MAX_LIVES;
  combo = 0;
  load();
}

// 編集されたコードを関数として取り出し、テストを順に実行する
function runTests(code, p) {
  let fn;
  try {
    fn = new Function(code + "\nreturn " + p.fn + ";")();
  } catch (e) {
    return { ok: false, msg: "構文エラー: " + e.message };
  }
  for (const [args, expected] of p.tests) {
    let got;
    try {
      got = fn(...args);
    } catch (e) {
      return { ok: false, msg: "実行エラー: " + e.message };
    }
    if (got !== expected) {
      return {
        ok: false,
        msg: `テスト失敗: 入力 ${JSON.stringify(args)} → 期待 ${expected}, 実際 ${got}`,
      };
    }
  }
  return { ok: true };
}

function retriggerClass(cls) {
  editorWrap.classList.remove(cls);
  void editorWrap.offsetWidth; // アニメーションを再起動
  editorWrap.classList.add(cls);
}

function failWith(msg) {
  pushLog("[ALERT] 不正な試行: " + msg);
  combo = 0;
  lives--;
  updateHud();
  resultEl.className = "ng";
  resultEl.textContent = msg + (lives > 0 ? `（ライフ残り ${lives}）` : "");
  retriggerClass("shake");
  sfx.fail();
  if (lives <= 0) {
    setTimeout(() => {
      showOverlay("GAME OVER", `スコア: ${score}`, "最初からやり直す", restart, "#f66");
    }, 500);
  }
}

// 原因の関数を選んでから直し、テストで正しさを判定する流れ
// 選択が違う場合はライフを減らし、テストは実行しない
checkBtn.addEventListener("click", () => {
  // 本番は、検証環境で合格した同じコードのときだけ反映できる
  if (!stagedOK || stagedCode !== editor.value) {
    resultEl.className = "ng";
    resultEl.textContent = "先に検証環境でテストしてください";
    return;
  }
  pushLog("[PROD] 検証済みのパッチを本番に反映");
  const p = problems[index];
  const r = runTests(editor.value, p);
  if (!r.ok) {
    failWith(r.msg);
    return;
  }
  combo++;
  // 得点 = 基本10 + コンボ + 正確さ（検証の失敗が少ないほど高い）
  const comboBonus = (combo - 1) * 5;
  const accuracy = Math.max(0, 20 - stageFails * 10);
  const gain = 10 + comboBonus + accuracy;
  const detail = `基本10 + コンボ${comboBonus} + 正確さ${accuracy}`;
  score += gain;
  locked = true;
  sfx.clear();
  updateHud();
  pushLog("[OK] パッチ適用、" + srvName(index) + " を隔離解除");
  resultEl.className = "ok";
  resultEl.textContent = `パッチ成功！ +${gain}点（${detail}）`;
  retriggerClass("flash-ok");
  const isLast = index === problems.length - 1;
  setTimeout(() => {
    if (isLast) {
      showOverlay("全ステージクリア！", `最終スコア: ${score} ／ ランク ${rankOf(score)}`, "もう一度遊ぶ", restart, "#6f6");
    } else {
      showOverlay("STAGE CLEAR", `+${gain}点（${detail}）／ コンボ ×${combo}`, "次のステージへ", () => { index++; load(); }, "#6f6");
    }
  }, 500);
});

load();
// 検証環境: テストを実行するだけで、ライフは減らさない
stageBtn.addEventListener("click", () => {
  const p = problems[index];
  const r = runTests(editor.value, p);
  if (r.ok) {
    stagedOK = true;
    stagedCode = editor.value;
    prodBtn.disabled = false;
    sfx.pass();
    pushLog("[STAGING] 検証環境で全テスト合格");
    resultEl.className = "ok";
    resultEl.textContent = "検証環境: 合格。本番に反映できます";
  } else {
    stagedOK = false;
    prodBtn.disabled = true;
    pushLog("[STAGING] 検証で失敗: " + r.msg);
    resultEl.className = "ng";
    resultEl.textContent = "検証環境: 失敗（本番には反映されません）\n" + r.msg;
    retriggerClass("shake");
    sfx.fail();
    // 検証に失敗すると、攻撃が進んで侵入度が上がる。上限に達すると侵入される
    stageFails++;
    updateIntrusion();
    pushLog("[WARN] 攻撃が進行: 侵入度 " + stageFails + "/" + MAX_FAILS);
    if (stageFails >= MAX_FAILS) onBreach();
  }
});

// コードを書き換えたら検証結果は無効になる
editor.addEventListener("input", () => {
  if (editor.value !== stagedCode) {
    stagedOK = false;
    prodBtn.disabled = true;
  }
});

// ヒント: 原因の関数名を教える（1ステージに1回、-10点）
hintBtn.addEventListener("click", () => {
  if (hintUsed || locked) return;
  hintUsed = true;
  hintBtn.disabled = true;
  score = Math.max(0, score - 10);
  updateHud();
  const p = problems[index];
  pushLog("[HINT] 怪しい関数: " + p.culprit);
  resultEl.className = "";
  resultEl.textContent = "ヒント: " + p.culprit + " の中身を見直してみましょう（-10点）";
});

// 音のON/OFF
soundBtn.addEventListener("click", () => {
  soundOn = !soundOn;
  soundBtn.textContent = "音: " + (soundOn ? "ON" : "OFF");
});

</script>
<div class="scan"></div>
</body>
</html>
